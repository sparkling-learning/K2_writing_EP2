<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小動物找食物 - 運筆遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: "Microsoft JhengHei", "PingFang HK", sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1414 / 2000;
            background-color: #fff; /* 底色保持白色，讓背景圖透出時顯得明亮 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            touch-action: none;
        }

        /* 獨立的背景圖層，設定 60% 透明度 */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.6; 
            z-index: 1;
        }

        #draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        #start-item {
            position: absolute;
            width: 36%; 
            z-index: 4;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
        }
        #start-item:active {
            transform: translate(-50%, -50%) scale(1.05); 
        }

        #end-item {
            position: absolute;
            width: 36%; 
            z-index: 3;
            transform: translate(-50%, -50%);
        }

        #hint-dot {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: rgba(255, 235, 59, 0.5);
            border: 4px solid #FFD700;
            border-radius: 50%;
            z-index: 2;
            transform: translate(-50%, -50%);
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        #message {
            font-size: 2.2rem;
            color: #FF7043;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        #progress-text {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 30px;
            font-weight: bold;
        }

        button {
            padding: 15px 35px;
            font-size: 1.5rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none;
            font-weight: bold;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 新增背景圖層 -->
    <div id="bg-layer"></div>
    <canvas id="draw-canvas"></canvas>
    <div id="hint-dot"></div>
    <img id="end-item" src="" alt="食物">
    <img id="start-item" src="" alt="動物">
    
    <div id="overlay">
        <div id="message">✨ 你真努力！</div>
        <div id="progress-text">進度: 1/3</div>
        <button id="restart-btn" onclick="restartGame()">再玩一次</button>
    </div>
</div>

<script>
    const stages = [
        { bg: 'BG1.png', startSrc: '1.png', endSrc: '2.png' }, 
        { bg: 'BG1.png', startSrc: '5.png', endSrc: '6.png' }, 
        { bg: 'BG2.png', startSrc: '3.png', endSrc: '4.png' }  
    ];

    let currentStage = 0;
    
    const START_X_PCT = 0.18; 
    const END_X_PCT = 0.82;   
    const Y_PCT = 0.68;       

    const container = document.getElementById('game-container');
    const bgLayer = document.getElementById('bg-layer'); // 取得背景圖層
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    const startItem = document.getElementById('start-item');
    const endItem = document.getElementById('end-item');
    const hintDot = document.getElementById('hint-dot');
    const overlay = document.getElementById('overlay');
    const message = document.getElementById('message');
    const progressText = document.getElementById('progress-text');
    const restartBtn = document.getElementById('restart-btn');

    let isDragging = false;
    let startPos = { x: 0, y: 0 };
    let containerRect;

    function initStage() {
        const stageData = stages[currentStage];
        // 將背景圖套用在 bgLayer 上，而不是 container
        bgLayer.style.backgroundImage = `url('${stageData.bg}')`;
        startItem.src = stageData.startSrc;
        endItem.src = stageData.endSrc;

        resizeCanvas();
        positionElements();
        drawHintLine();
    }

    function resizeCanvas() {
        containerRect = container.getBoundingClientRect();
        canvas.width = containerRect.width;
        canvas.height = containerRect.height;
    }
    
    window.addEventListener('resize', () => {
        resizeCanvas();
        positionElements();
        drawHintLine();
    });

    function positionElements() {
        const startX = canvas.width * START_X_PCT;
        const endX = canvas.width * END_X_PCT;
        const y = canvas.height * Y_PCT;

        startItem.style.left = startX + 'px';
        startItem.style.top = y + 'px';
        startPos = { x: startX, y: y };

        endItem.style.left = endX + 'px';
        endItem.style.top = y + 'px';

        hintDot.style.left = endX + 'px';
        hintDot.style.top = y + 'px';
    }

    function drawHintLine() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.setLineDash([15, 20]); 
        ctx.moveTo(canvas.width * START_X_PCT, canvas.height * Y_PCT);
        ctx.lineTo(canvas.width * END_X_PCT, canvas.height * Y_PCT);
        ctx.lineWidth = 14;
        // 背景調淡後，提示線可以稍微加深一點點，確保幼兒看清楚
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)'; 
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.setLineDash([]); 
    }

    function getPointerPos(e) {
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - containerRect.left,
            y: clientY - containerRect.top
        };
    }

    function handleStart(e) {
        e.preventDefault(); 
        isDragging = true;
    }

    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        
        let pos = getPointerPos(e);
        let constrainedY = startPos.y; 
        let constrainedX = Math.max(startPos.x, pos.x);
        
        startItem.style.left = constrainedX + 'px';
        startItem.style.top = constrainedY + 'px'; 

        drawHintLine(); 
        ctx.beginPath();
        ctx.moveTo(startPos.x, startPos.y);
        ctx.lineTo(constrainedX, constrainedY);
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#FF5722'; 
        ctx.lineCap = 'round';
        ctx.stroke();
    }

    function handleEnd(e) {
        if (!isDragging) return;
        isDragging = false;

        let currentLeft = parseFloat(startItem.style.left);
        let targetLeft = canvas.width * END_X_PCT;

        if (Math.abs(currentLeft - targetLeft) < 50 || currentLeft >= targetLeft) {
            stageComplete();
        } else {
            startItem.style.transition = 'left 0.4s ease-out, top 0.4s ease-out';
            startItem.style.left = startPos.x + 'px';
            startItem.style.top = startPos.y + 'px';
            setTimeout(() => { startItem.style.transition = 'transform 0.1s'; }, 400);
            drawHintLine(); 
        }
    }

    startItem.addEventListener('mousedown', handleStart);
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseup', handleEnd);

    startItem.addEventListener('touchstart', handleStart, {passive: false});
    document.addEventListener('touchmove', handleMove, {passive: false});
    document.addEventListener('touchend', handleEnd);

    function stageComplete() {
        currentStage++;
        
        if (currentStage < stages.length) {
            message.innerText = '✨ 你真努力！';
            progressText.innerText = `進度: ${currentStage} / 3`;
            restartBtn.style.display = 'none';
            overlay.classList.add('show');
            
            setTimeout(() => {
                overlay.classList.remove('show');
                initStage();
            }, 2000); 
            
        } else {
            message.innerText = '🎉 太棒了！任務全部完成！你做得非常好！';
            progressText.innerText = `進度: 3 / 3`;
            restartBtn.style.display = 'block';
            overlay.classList.add('show');
        }
    }

    function restartGame() {
        currentStage = 0;
        overlay.classList.remove('show');
        initStage();
    }

    window.onload = () => {
        setTimeout(initStage, 150); 
    };
</script>

</body>
</html>
