<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幼兒運筆遊戲</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e0f7fa; font-family: sans-serif; overflow: hidden; touch-action: none; }

        #game-container {
            position: relative; width: 90vw; max-width: 900px; height: 60vh; max-height: 500px;
            background-color: #ffffff; border-radius: 30px; border: 8px solid #ffcc80; overflow: hidden;
        }

        #progress { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; color: #5d4037; z-index: 10; }

        #bridge-area { position: absolute; top: 50%; left: 15%; right: 15%; height: 80px; transform: translateY(-50%); z-index: 1; }
        #bridge { width: 100%; height: 100%; background: linear-gradient(to bottom, #8d6e63, #5d4037); border-radius: 10px; }

        /* 起點紅點 */
        #start-dot {
            position: absolute; left: 0; top: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background-color: #ff3d00; border: 4px solid #fff; border-radius: 50%;
            z-index: 2; box-shadow: 0 0 15px #ff3d00; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } }

        /* 目標與角色 */
        #target { position: absolute; right: 12%; top: 50%; transform: translateY(-50%); font-size: 80px; z-index: 2; }
        #character { position: absolute; left: 15%; top: 50%; transform: translate(-50%, -50%); font-size: 80px; z-index: 10; cursor: grab; }

        /* 大姆指圖示：固定在遊戲視窗的「絕對右上角」，絕對不覆蓋動物 */
        #thumb-up {
            position: absolute; 
            top: 20px; 
            right: 25px; 
            transform: scale(0);
            font-size: 70px; 
            z-index: 50; 
            display: none;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.2));
        }
        .show-thumb { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop { 
            0% { transform: scale(0) rotate(-20deg); } 
            70% { transform: scale(1.2) rotate(10deg); } 
            100% { transform: scale(1) rotate(0deg); } 
        }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; opacity: 0; visibility: hidden; }
        .overlay.active { opacity: 1; visibility: visible; }
    </style>
</head>
<body>

<audio id="cheer-sound" src="https://actions.google.com/sounds/v1/crowds/kids_cheering.ogg" preload="auto"></audio>

<div id="game-container">
    <div id="progress">進度: 1 / 3</div>
    <!-- 遊戲右上角固定顯示的大姆指 -->
    <div id="thumb-up">👍</div>
    
    <div id="bridge-area"><div id="bridge"></div><div id="start-dot"></div></div>
    <div id="target">🐟</div>
    <div id="character">🐱</div>
    
    <div id="end-screen" class="overlay">
        <h1>✨ 你真努力！</h1>
        <button onclick="location.reload()" style="padding: 15px 40px; font-size: 24px; border-radius: 50px; border:none; background:#4caf50; color:white; cursor:pointer;">再玩一次</button>
    </div>
</div>

<script>
    const levels = [
        { char: '🐱', target: '🐟', bg: '#ffebee' },
        { char: '🐶', target: '🦴', bg: '#e8f5e9' },
        { char: '🐭', target: '🧀', bg: '#fff8e1' }
    ];
    let cur = 0, isDragging = false, startX, transX = 0;

    const charEl = document.getElementById('character'), dotEl = document.getElementById('start-dot'), thumbEl = document.getElementById('thumb-up');

    function load() {
        if(cur >= levels.length) return document.getElementById('end-screen').classList.add('active');
        charEl.textContent = levels[cur].char;
        document.getElementById('target').textContent = levels[cur].target;
        document.getElementById('game-container').style.backgroundColor = levels[cur].bg;
        document.getElementById('progress').textContent = `進度: ${cur + 1} / 3`;
        reset();
    }

    function reset() {
        transX = 0; 
        charEl.style.transition = '0.4s'; 
        charEl.style.transform = `translate(-50%, -50%)`;
        dotEl.style.display = 'block'; 
        thumbEl.style.display = 'none'; 
        thumbEl.classList.remove('show-thumb');
    }

    function onStart(e) {
        isDragging = true;
        startX = (e.touches ? e.touches[0].clientX : e.clientX);
        dotEl.style.display = 'none';
    }

    function onMove(e) {
        if(!isDragging) return;
        const currentX = (e.touches ? e.touches[0].clientX : e.clientX);
        transX = currentX - startX;
        charEl.style.transition = 'none';
        charEl.style.transform = `translate(calc(-50% + ${transX}px), -50%)`;
    }

    function onEnd() {
        if(!isDragging) return;
        isDragging = false;
        
        // 判定終點：當拉動距離超過視窗寬度的 50%
        if(transX > (window.innerWidth * 0.5)) {
            charEl.style.transition = '0.3s';
            // 播放音效與在畫面上方右角顯示大姆指
            document.getElementById('cheer-sound').play();
            thumbEl.style.display = 'block';
            thumbEl.classList.add('show-thumb');
            setTimeout(() => { cur++; load(); }, 1500);
        } else {
            reset();
        }
    }

    charEl.addEventListener('mousedown', onStart);
    charEl.addEventListener('touchstart', onStart, {passive: false});

    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, {passive: false});

    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchend', onEnd);

    load();
</script>
</body>
</html>
